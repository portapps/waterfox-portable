name: build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
    tags:
      - '*'
  pull_request:

jobs:
  build:
    uses: chyaroscuric/waterfox-portable/.github/workflows/temp.yml@master
    permissions:
      contents: write # required to create a GitHub release on push with a tag
