name: build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # Needed for creating GitHub releases

on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
    tags:
      - '*'
  pull_request:

env:
  # Do not auto-upgrade the gotoolchain
  GOTOOLCHAIN: local
  GO_VERSION: '1.26'
  NODE_VERSION: '20'
  JAVA_VERSION: '11'
  ANT_VERSION: '1.10.15'
  JAVA_TOOL_OPTIONS: '-Dfile.encoding=UTF8'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: adopt
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up ANT
        run: choco install ant -y --no-progress
        shell: pwsh

      - name: Java version
        run: |
          java -XshowSettings:properties -version

      - name: ANT version
        run: |
          ant -version

      - name: Node version
        run: |
          node --version

      - name: Config
        run: |
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          echo "$(go env GOPATH)/bin/windows_386" >> $GITHUB_PATH
          echo "PORTAPPS_VERSION=$(cat go.mod | grep github.com/portapps/portapps | awk '{print $NF}')" >> $GITHUB_ENV
          echo "PORTAPPS_DIR=./.portapps" >> $GITHUB_ENV
        shell: bash

      - name: Checkout core
        uses: actions/checkout@v4
        with:
          repository: portapps/portapps
          ref: ${{ env.PORTAPPS_VERSION }}
          path: ${{ env.PORTAPPS_DIR }}

      - name: Cache Portapps bin
        uses: actions/cache@v4
        with:
          path: ${{ env.PORTAPPS_DIR }}/bin
          key: portapps-bin-${{ env.PORTAPPS_VERSION }}

      - name: Build
        run: |
          ant release -Dcore.dir=${{ env.PORTAPPS_DIR }}
        shell: bash

      - name: Upload assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}
          path: bin/release/*

  release:
    runs-on: ubuntu-latest
    needs:
      - build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Prepare
        run: |
          echo "GIT_TAGNAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Download assets
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.repository.name }}
          path: ./bin/release

      - name: List artifacts
        run: |
          tree -nh ./bin/release

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            bin/release/*
          name: ${{ env.GIT_TAGNAME }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
